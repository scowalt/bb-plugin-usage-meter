when:
  - event: [push, pull_request]

labels:
  ci_os: linux

steps:
  - name: check-all-plugins
    image: node:24.20.0-bookworm@sha256:be23f54a88d34e8824c741b19b91064094f92c1c97b194144bfc8b50d67258e2
    environment:
      PATH: /tmp/ci-tools/bin:/tmp/ci-tools/node_modules/.bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
      PYTHON: /usr/bin/python3
      npm_config_python: /usr/bin/python3
    commands:
      - mkdir -p /tmp/ci-tools/bin
      - test -f /usr/local/lib/node_modules/npm/node_modules/node-gyp/bin/node-gyp.js
      - ln -s /usr/local/lib/node_modules/npm/node_modules/node-gyp/bin/node-gyp.js /tmp/ci-tools/bin/node-gyp
      - npm install --prefix /tmp/ci-tools --no-audit --no-fund bun@1.3.11
      - |
        set -eu
        for plugin in plugins/*; do
          test -f "$${plugin}/package.json" || continue
          echo "Checking $${plugin}"
          (
            cd "$${plugin}"
            bun install --frozen-lockfile
            if test "$${plugin}" = plugins/file-manager; then
              bunx --package bb-app@0.43.3 bb plugin types --check .
            fi
            ./node_modules/.bin/tsc --noEmit
            case "$${plugin}" in
              plugins/doc-review|plugins/file-manager)
                bun run test --maxWorkers=2
                ;;
            esac
            bunx --package bb-app@0.43.3 bb plugin build .
          )
        done
